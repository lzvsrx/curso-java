spring.application.name=academia-api
# Perfil padrão usa H2, então o projeto roda sem instalar PostgreSQL.
spring.datasource.url=jdbc:h2:mem:academia
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Para PostgreSQL, comente as linhas H2 acima e use:
# spring.datasource.url=jdbc:postgresql://localhost:5432/academia
# spring.datasource.username=postgres
# spring.datasource.password=SUA_SENHA
# spring.datasource.driver-class-name=org.postgresql.Driver
